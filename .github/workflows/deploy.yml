name: Deploy NEUST CE Website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate updated watermarked PDF documents
        run: |
          python -m pip install python-docx pymupdf pillow gdown
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice-writer fonts-dejavu-core
          gdown --id 1Ru-c3IBuiZ-LDr1_NltaDDU-VhS8FufE -O /tmp/neust-2017.docx
          gdown --id 17BrgwyH1kR8ekg7ksZKfudJWmfoRBBD6 -O /tmp/neust-2018.docx
          python scripts/build_image_previews.py
      - name: Publish static site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: '.github,README.md'
