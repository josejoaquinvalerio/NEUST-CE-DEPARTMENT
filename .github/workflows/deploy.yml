name: Deploy NEUST CE Website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: neust-ce-pages-publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve existing 2017 and 2018 published page images
        run: |
          git fetch origin gh-pages
          git checkout origin/gh-pages -- compre-1/pages/2017-1.webp compre-1/pages/2017-2.webp compre-1/pages/2017-3.webp compre-1/pages/2017-4.webp
          git checkout origin/gh-pages -- compre-1/pages/2018-1.webp compre-1/pages/2018-2.webp compre-1/pages/2018-3.webp
      - name: Verify and render 2019 questionnaire
        run: |
          python -m pip install pymupdf pillow
          curl -L --fail -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/josejoaquinvalerio/NEUST-CE-DEPARTMENT/git/blobs/a807ede4153a61a41c94be4eb4ec0561a6d3c8bb' | python -c "import sys,json,base64; d=json.load(sys.stdin); open('/tmp/neust-2019.pdf','wb').write(base64.b64decode(d['content']))"
          echo 'ad057489da16b3c64acfb1734e7b12ff81552df62bf23dac6847d3ab109036c8  /tmp/neust-2019.pdf' | sha256sum -c -
          python scripts/build_2019_preview.py
      - name: Publish static site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: '.github,README.md,scripts'
