<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEUST CE | COMPRE 1</title><style>:root{font-family:Arial,sans-serif;color:#173d54;background:#d9f3ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#d9f3ff,#b9e8fa);min-height:100vh;user-select:none}header{text-align:center;padding:42px 15px 24px}header p{color:#4c7286}h1{font-size:clamp(26px,4vw,42px)}main{max-width:950px;margin:auto;padding:15px 20px 50px}.tabs{display:flex;gap:12px;justify-content:center;margin-bottom:18px}.tabs button{padding:13px 25px;border:1px solid #80c4e1;border-radius:12px;background:#edfaff;color:#18536e;font-size:16px;font-weight:bold;cursor:pointer}.tabs button[aria-selected=true]{background:#217ea9;color:white}.panel{background:#effaff;border:1px solid #a4d7ed;border-radius:18px;padding:20px}.panel-head{text-align:center}.pages{display:grid;gap:18px;justify-items:center}.page{max-width:760px;width:100%}.page img{display:block;width:100%;pointer-events:none;-webkit-user-drag:none}.page-label{text-align:center;font-size:12px;color:#547c91;margin:6px}footer{text-align:center;padding:24px;font-weight:bold;font-size:13px;color:#285f7d}@media(max-width:600px){.panel{padding:12px}}</style></head><body><header><p>NUEVA ECIJA UNIVERSITY OF SCIENCE AND TECHNOLOGY</p><h1>Civil Engineering · COMPRE 1</h1><p>2026 Recitation Materials · Student Reading Portal</p></header><main><nav class="tabs"><button id="b2017" onclick="show(2017)">2017 Set</button><button id="b2018" onclick="show(2018)">2018 Set</button></nav><section class="panel"><div class="panel-head"><h2 id="heading"></h2><p>Hydraulics · Geotechnical and Foundation Engineering</p></div><div class="pages" id="pages"></div></section></main><footer>PREPARED BY COMPRE 1 INSTRUCTORS</footer><script>function show(y){document.getElementById('heading').textContent=y+' Recitation Set';for(const a of [2017,2018])document.getElementById('b'+a).setAttribute('aria-selected',String(a===y));document.getElementById('pages').innerHTML=Array.from({length:y===2017?4:3},(_,i)=>'<div class="page"><img src="pages/'+y+'-'+(i+1)+'.webp" alt="'+y+' recitation page '+(i+1)+'" loading="lazy" draggable="false"><div class="page-label">Page '+(i+1)+'</div></div>').join('')}show(2017);document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['s','p','u'].includes(e.key.toLowerCase()))e.preventDefault()});</script></body></html>
